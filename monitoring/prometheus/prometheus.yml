global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: node
    static_configs:
      - targets: ['10.0.0.4:9100']
        labels:
          vm: vm-tools
      - targets: ['10.0.1.4:9100']
        labels:
          vm: vm-k8s

  - job_name: kube-state-metrics
    scrape_interval: 5s
    static_configs:
      - targets: ['10.0.1.4:30080']

  - job_name: medisur-api
    scrape_interval: 5s
    metrics_path: /metrics
    static_configs:
      - targets: ['10.0.1.4:80']

  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://10.0.0.4:8080/login
          - http://10.0.0.4:9000/api/system/status
          - http://10.0.0.4:3000/api/health
          - http://10.0.0.4:9090/-/healthy
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
